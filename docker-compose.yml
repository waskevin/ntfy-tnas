version: "3.8"
services:
  ntfy:
    image: binwiederhier/ntfy:v2.38.0
    command: serve
    restart: unless-stopped
    user: "1000:1000"
    ports:
      - "11013:80"
    volumes:
      - ./cache:/var/cache/ntfy
    environment:
      - TZ=Asia/Shanghai
    healthcheck:
      test: ["CMD", "ntfy", "--help"]
      interval: 30s
      timeout: 10s
      retries: 3
x-app-meta:
  web:
    port: 11013
    protocol: http
